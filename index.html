<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Reader</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- CUSTOM MODALS -->
    <div id="custom-modal" class="modal-wrap">
        <div class="modal-box">
            <div class="modal-title" id="modal-title">Konfirmasi</div>
            <div class="modal-msg" id="modal-msg">Pesan...</div>
            <div class="modal-actions" id="modal-actions">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">Zen Reader</div>
        <div class="controls">
            <button id="font-btn" class="btn-icon" title="Ukuran Huruf">
                <span style="font-size: 1.2rem; font-weight: bold;">Aa</span>
            </button>
            <button id="line-height-btn" class="btn-icon" title="Jarak Baris">
                <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12M8 17h12M4 7v10M4 7l-2 2M4 7l2 2M4 17l-2-2M4 17l2-2" /></svg>
            </button>
            <button id="theme-btn" class="btn-icon" title="Mode Gelap/Terang">
                <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
            <button id="reset-btn" class="btn-icon" title="Ganti Buku / Tutup">
                <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
        <div class="top-progress-container"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </header>

    <!-- Sidebar ToC -->
    <div class="toc-overlay" id="toc-overlay"></div>
    <aside class="toc-sidebar">
        <div class="toc-header"><span>Daftar Isi</span><span id="close-toc" style="cursor:pointer; font-size:1.5rem;">&times;</span></div>
        <ul class="toc-list" id="toc-list"></ul>
    </aside>

    <!-- Content -->
    <main id="main-container">
        <section id="upload-view">
            <div class="upload-box">
                <label for="file-upload" style="cursor: pointer;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">📚</div>
                    <div style="font-size: 1.2rem; font-weight: bold;">Upload File Novel (.txt)</div>
                    <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.5rem;">Otomatis format paragraf & chapter</div>
                </label>
                <input type="file" id="file-upload" accept=".txt" style="display: none;">
            </div>
            <div class="loader" id="loader"></div>
            <p id="status-text" style="margin-top: 1rem; color: var(--text-secondary);"></p>
        </section>

        <article id="reader-view">
            <h2 id="chapter-title">Chapter 1</h2>
            <div id="reader-content"></div>
        </article>
    </main>

    <!-- Footer Controls -->
    <footer class="reader-footer" id="reader-footer">
        <button class="nav-arrow" id="prev-btn">&larr;</button>
        <button class="toc-trigger-btn" id="toc-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            <span>Daftar Isi</span>
        </button>
        <button class="nav-arrow" id="next-btn">&rarr;</button>
    </footer>

    <!-- Logic JS -->
</body>
</html>
